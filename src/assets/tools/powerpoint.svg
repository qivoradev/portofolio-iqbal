<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" fill="none">
  <!-- Slot placeholder PowerPoint — ganti dengan logo resmi Microsoft PowerPoint SVG -->
  <!-- Label: Microsoft PowerPoint #D24726 -->
  <rect x="4" y="4" width="48" height="48" rx="6" fill="#D24726"/>
  <!-- Slide outline -->
  <rect x="8" y="12" width="40" height="28" rx="3" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
  <!-- Slide content lines -->
  <rect x="14" y="19" width="20" height="3" rx="1" fill="white" opacity="0.9"/>
  <rect x="14" y="25" width="28" height="2" rx="1" fill="white" opacity="0.7"/>
  <rect x="14" y="30" width="24" height="2" rx="1" fill="white" opacity="0.6"/>
  <!-- Presenter podium -->
  <rect x="26" y="40" width="4" height="6" rx="1" fill="white" opacity="0.8"/>
  <rect x="18" y="46" width="20" height="3" rx="1" fill="white" opacity="0.7"/>
</svg>
